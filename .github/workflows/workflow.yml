name: workflow.yml
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build-docker-image:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-and-push.yml
    secrets: inherit
  check-server:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/check-server.yml
  check-client:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/check-client.yml