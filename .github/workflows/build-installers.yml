name: build client installers (reusable)

on:
  workflow_dispatch:
  workflow_call: 
  push:
    branches:
      - master

jobs:
  build-installers:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with jpackage
        run: ./gradlew :client:jpackage
        shell: bash

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Auction-Installer-${{ runner.os }}
          path: |
            client/build/jpackage/*.exe
            client/build/jpackage/*.msi
            client/build/jpackage/*.dmg
            client/build/jpackage/*.pkg
            client/build/jpackage/*.deb
            client/build/jpackage/*.rpm
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: build-installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Auto-build #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: installers/*
